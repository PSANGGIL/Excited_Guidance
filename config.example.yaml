checkpointing:
  # These options SAVE checkpoints during training. They do not load a checkpoint
  # for a fresh run. A checkpoint is loaded only with --resume or --seed-model.
  every_n_epochs: 1
  monitor: val_cond_total_loss
  mode: min
  save_last: true
  save_top_k: 3


dataset:
  processed_data_dir: /home/jovyan/cpu-only-1-datavol-1/psg/generation/STGG-AL/data/data_
  dataset_name: csvmol

  n_atom_charges: 6
  charge_offset: 2
  n_bond_types: 5
  train_split: train
  validate_processed_data: true
  conditioning:
    enabled: true
    normalize: true
    property: f_osc 

guidance:
  enabled: true
  guidance_type: classifier_free_guidance
  p_uncond: 0.1

interpolant_scheduler:
  schedule_type:
    x: linear
    a: linear
    c: linear
    e: linear
  cosine_params:
    x: 1.0
    a: 2.0
    c: 2.0
    e: 1.5

lr_scheduler:
  base_lr: 0.00025
  weight_decay: 1.0e-12
  warmup_length: 0.0
  restart_interval: 0
  restart_type: linear

model_setting:
  property_embedding_dim: 256
  properties_handle_method: concatenate_sum
  gaussian_expansion:
    enabled: false
    n_gaussians: 5

mol_fm:
  parameterization: ctmc
  time_scaled_loss: false
  weight_ae: false
  target_blur: 0.0
  # Differentiable penalty on expected bond-order valence overflow. This trains
  # the model itself; it does not delete or rewrite bonds after generation.
  valence_loss_weight: 0.05
  total_loss_weights:
    x: 3.0
    a: 0.4
    c: 1.0
    e: 2.0
  prior_config:
    x:
      type: centered-normal
      align: true
      kwargs:
        std: 1.0
    a:
      type: ctmc
      align: false
      kwargs: {}
    c:
      type: ctmc
      align: false
      kwargs: {}
    e:
      type: ctmc
      align: false
      kwargs: {}

training:
  batch_size: 128
  num_workers: 4
  # Directed complete-graph edge limit. Actual batch size is reduced automatically.
  max_num_edges: 400000
  max_num_edges_eval: 400000
  output_dir: ./runs
  evaluation:
    mols_to_sample: 64
    sample_interval: 1.0
    val_loss_interval: 1.0

  # Validation is always fully conditional. The random CFG dropout used in
  # training is disabled, and the same corruption seed is reused each epoch.
  validation:
    seed: 12345
    compare_shuffled_condition: true

  early_stopping:
    enabled: true
    monitor: val_cond_total_loss
    mode: min
    patience: 50
    min_delta: 0.0

  trainer_args:
    accelerator: gpu
    devices: 1
    strategy: auto
    max_epochs: 1000
    accumulate_grad_batches: 1
    gradient_clip_algorithm: value
    gradient_clip_val: 1.0
    limit_val_batches: 1.0

vector_field:
  n_vec_channels: 16
  n_hidden_scalars: 256
  n_hidden_edge_feats: 128
  n_recycles: 1
  n_molecule_updates: 8
  convs_per_update: 1
  n_message_gvps: 3
  n_update_gvps: 3
  separate_mol_updaters: true
  message_norm: 100
  update_edge_w_distance: true
  rbf_dmax: 14
  rbf_dim: 32
  n_cp_feats: 4
  stochasticity: 10.0
  high_confidence_threshold: 0.0

wandb:
  mode: disabled
  project: mol-fm
  name: os_cfg
